name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: custom-nodes
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: custom-nodes
        run: npm run lint

      - name: Test
        working-directory: custom-nodes
        run: npm test

      - name: Build
        working-directory: custom-nodes
        run: npm run build
